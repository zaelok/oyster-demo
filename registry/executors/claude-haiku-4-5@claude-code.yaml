id: claude-haiku-4-5@claude-code
kind: model
model: claude-haiku-4-5
settings: {effort: default, thinking: adaptive}   # CLI default; on review prompts a median 4,900 output tokens per call
harness: claude-code-cli-2.1.260                  # -p, --tools "", --max-turns 1, prompt wrapped in the CLI's own scaffolding
rates: {input_per_1m: 1.00, output_per_1m: 5.00, cache_discount: 0.90}
